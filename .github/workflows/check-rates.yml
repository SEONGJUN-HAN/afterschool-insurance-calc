name: 방과후강사 보험료율 자동 점검

on:
  schedule:
    # 매월 1일 00:00 UTC = 한국시간 09:00
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: rate-check
  cancel-in-progress: false

jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 근로복지공단 요율 점검
        id: check
        run: node scripts/check-rates.mjs

      - name: 점검 결과 커밋 (GitHub Pages에 바로 반영)
        run: |
          git config user.name "rate-check-bot"
          git config user.email "actions@github.com"
          git add rate-status.json
          git diff --cached --quiet || git commit -m "chore: 요율 점검 결과 갱신 ($(date -u +%Y-%m-%d))"
          git push

      - name: 변경 감지 시 이슈 등록
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync('rate-status.json', 'utf8'));
            const body = (status.issues || []).map(i => `- ${i}`).join('\n')
              + '\n\n공식 계산기와 대조한 뒤 index.html의 요율표(EI/AI 객체)를 갱신하고, '
              + 'known-rates.json도 새 기준값으로 함께 갱신해 주세요.\n\n'
              + '- 고용보험 계산기: https://www.comwel.or.kr/comwel/bohumcal2.jsp\n'
              + '- 산재보험 계산기: https://www.comwel.or.kr/comwel/bohumcal4.jsp';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `요율 변경 감지 — ${status.checkedAt}`,
              body,
            });
